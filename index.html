
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ContactHub - Smart Contact Manager</title>

   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        
  
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    
    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<!--          NAVBAR          -->

<nav class="navbar bg-white border-bottom py-3">

    <div class="container-fluid px-3 px-lg-5">

        <div class="d-flex align-items-center">

            <div class="brand-icon rounded-3 d-flex justify-content-center align-items-center me-3">
                <i class="bi bi-person-vcard-fill"></i>
            </div>

            <div>

                <h4 class="m-0 fw-bold brand-name">
                    Contact<span>Hub</span>
                </h4>

                <p class="m-0 small">
                    Smart Contact Manager
                </p>

            </div>

        </div>


        <div class="d-flex align-items-center gap-3">

            <button
                class="btn add-contact-btn rounded-3 px-3 px-md-4"
                onclick="openAddModal()">

                <i class="bi bi-plus-lg me-1"></i>

                Add Contact

            </button>


            <i class="bi bi-bell-fill nav-icon d-none d-sm-block"></i>

            <i class="bi bi-gear-fill nav-icon d-none d-sm-block"></i>


            <div class="profile overflow-hidden d-none d-sm-block">

                <img src="imeg/avatar-2(2).jpg"  alt="profile">
                    
                   

            </div>

        </div>

    </div>

</nav>


<!--          MAIN           -->
<main class="container-fluid px-3 px-lg-5 py-4">

<!--       STATISTICS                -->
    <div class="row g-3 mb-4">


        <!-- TOTAL -->

        <div class="col-12 col-md-4">

            <div class="stat-card bg-white border rounded-4 p-3 p-md-4 h-100">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon total-icon rounded-3 d-flex justify-content-center align-items-center">

                        <i class="bi bi-people-fill"></i>

                    </div>


                    <div>

                        <p class="m-0 stat-label">
                            TOTAL
                        </p>

                        <h4
                            id="totalCount"
                            class="m-0 mt-1">

                            0

                        </h4>

                    </div>

                </div>

            </div>

        </div>



        <!-- FAVORITES -->

        <div class="col-12 col-md-4">

            <div class="stat-card bg-white border rounded-4 p-3 p-md-4 h-100">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon favorite-icon rounded-3 d-flex justify-content-center align-items-center">

                        <i class="bi bi-star-fill"></i>

                    </div>


                    <div>

                        <p class="m-0 stat-label">
                            FAVORITES
                        </p>

                        <h4
                            id="favoriteCount"
                            class="m-0 mt-1">

                            0

                        </h4>

                    </div>

                </div>

            </div>

        </div>



        <!-- EMERGENCY -->

        <div class="col-12 col-md-4">

            <div class="stat-card bg-white border rounded-4 p-3 p-md-4 h-100">

                <div class="d-flex align-items-center gap-3">

                    <div class="stat-icon emergency-icon rounded-3 d-flex justify-content-center align-items-center">

                        <i class="bi bi-heart-pulse-fill"></i>

                    </div>


                    <div>

                        <p class="m-0 stat-label">
                            EMERGENCY
                        </p>

                        <h4
                            id="emergencyCount"
                            class="m-0 mt-1">

                            0

                        </h4>

                    </div>

                </div>

            </div>

        </div>

    </div>


<!--           CONTENT                -->

    <div class="row g-4">

<!--         ALL CONTACTS                  -->
        <div class="col-12 col-lg-9">


            <div>

                <h2 class="fw-bold mb-1">
                    All Contacts
                </h2>

                <p class="text-secondary mb-4">

                    Manage and organize your
                    <span id="contactsNumber">0</span>
                    contacts

                </p>


                <!-- SEARCH -->

                <div
                    class="input-group bg-white rounded-3 border search-box mb-4">

                    <span class="input-group-text bg-transparent border-0">

                        <i class="bi bi-search"></i>

                    </span>


                    <input
                        type="text"
                        id="searchInput"
                        class="form-control border-0 shadow-none"
                        placeholder="Search contacts..."
                        onkeyup="searchContacts()">

                </div>


                <!-- CONTACTS -->

                <div
                    id="contactsContainer"
                    class="row g-3">

                </div>

            </div>

        </div>


<!--         RIGHT SIDE                        -->

        <div class="col-12 col-lg-3">


            <!-- FAVORITES -->

            <div class="side-card bg-white border rounded-4 overflow-hidden mb-4">


                <div class="side-header favorite-header p-3">

                    <div class="d-flex align-items-center gap-3">

                        <div class="side-icon favorite-icon rounded-3 d-flex justify-content-center align-items-center">

                            <i class="bi bi-star-fill"></i>

                        </div>


                        <div>

                            <h6 class="fw-bold m-0">
                                Favorites
                            </h6>

                            <small class="text-secondary">
                                Quick access to starred contacts
                            </small>

                        </div>

                    </div>

                </div>


                <div
                    id="favoritesContainer"
                    class="p-3">

                    <p class="text-secondary text-center small m-0">
                        No favorites yet
                    </p>

                </div>

            </div>



            <!-- EMERGENCY -->

            <div class="side-card bg-white border rounded-4 overflow-hidden">


                <div class="side-header emergency-header p-3">

                    <div class="d-flex align-items-center gap-3">

                        <div class="side-icon emergency-icon rounded-3 d-flex justify-content-center align-items-center">

                            <i class="bi bi-heart-pulse-fill"></i>

                        </div>


                        <div>

                            <h6 class="fw-bold m-0">
                                Emergency
                            </h6>

                            <small class="text-secondary">
                                Important contacts for urgent calls
                            </small>

                        </div>

                    </div>

                </div>


                <div
                    id="emergencyContainer"
                    class="p-3">

                    <p class="text-secondary text-center small m-0">
                        No emergency contacts
                    </p>

                </div>

            </div>

        </div>

    </div>

</main>


<!--         MODAL         -->

<div
    class="modal fade"
    id="contactModal"
    tabindex="-1">


    <div class="modal-dialog modal-dialog-centered modal-lg">


        <div class="modal-content rounded-4 border-0">


            <!-- MODAL HEADER -->

            <div class="modal-header border-0 px-4 pt-4">

                <h5
                    id="modalTitle"
                    class="modal-title fw-bold">

                    Add New Contact

                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">

                </button>

            </div>



            <!-- MODAL BODY -->

            <div class="modal-body px-4">


                <!-- PHOTO -->

                <div class="text-center mb-4">

                    <div
                        class="contact-photo rounded-circle overflow-hidden mx-auto mb-2">

                        <img
                            id="contactPhoto"
                            src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                            alt="contact">

                    </div>


                    <label
                        for="imageInput"
                        class="small text-secondary"
                        style="cursor:pointer;">

                        <i class="bi bi-camera-fill me-1"></i>

                        Change Photo

                    </label>


                    <input
                        type="file"
                        id="imageInput"
                        accept="image/*"
                        class="d-none">

                </div>



                <!-- FORM -->

                <form id="contactForm">


                    <!-- NAME -->

                    <div class="mb-3">

                        <label
                            for="fullName"
                            class="form-label">

                            Full Name
                            <span class="text-danger">*</span>

                        </label>


                        <input
                            type="text"
                            id="fullName"
                            class="form-control rounded-3"
                            placeholder="Enter full name">

                    </div>



                    <!-- PHONE -->

                    <div class="mb-3">

                        <label
                            for="phoneNumber"
                            class="form-label">

                            Phone Number
                            <span class="text-danger">*</span>

                        </label>


                        <input
                            type="text"
                            id="phoneNumber"
                            class="form-control rounded-3"
                            placeholder="e.g., 01012345678">

                    </div>



                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label
                            for="emailAddress"
                            class="form-label">

                            Email Address

                        </label>


                        <input
                            type="email"
                            id="emailAddress"
                            class="form-control rounded-3"
                            placeholder="name@example.com">

                    </div>



                    <!-- ADDRESS -->

                    <div class="mb-3">

                        <label
                            for="address"
                            class="form-label">

                            Address

                        </label>


                        <input
                            type="text"
                            id="address"
                            class="form-control rounded-3"
                            placeholder="Enter address">

                    </div>



                    <!-- GROUP -->

                    <div class="mb-3">

                        <label
                            for="group"
                            class="form-label">

                            Group

                        </label>


                        <select
                            id="group"
                            class="form-select rounded-3">

                            <option value="">
                                Select a group
                            </option>

                            <option value="Family">
                                Family
                            </option>

                            <option value="Friends">
                                Friends
                            </option>

                            <option value="Work">
                                Work
                            </option>

                        </select>

                    </div>



                    <!-- NOTES -->

                    <div class="mb-3">

                        <label
                            for="notes"
                            class="form-label">

                            Notes

                        </label>


                        <textarea
                            id="notes"
                            class="form-control rounded-3"
                            rows="3"
                            placeholder="Add notes about this contact">
                        </textarea>

                    </div>



                    <!-- OPTIONS -->

                    <div class="d-flex flex-column flex-sm-row gap-3 gap-sm-4">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="favorite">

                            <label
                                class="form-check-label"
                                for="favorite">

                                ⭐ Favorite

                            </label>

                        </div>


                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="emergency">

                            <label
                                class="form-check-label"
                                for="emergency">

                                ❤️ Emergency

                            </label>

                        </div>

                    </div>

                </form>

            </div>



            <!-- MODAL FOOTER -->

            <div class="modal-footer border-0 px-4 pb-4">


                <button
                    type="button"
                    class="btn btn-light px-4 rounded-3"
                    data-bs-dismiss="modal">

                    Cancel

                </button>


                <button
                    type="button"
                    class="btn save-btn px-4 rounded-3"
                    onclick="saveContact()">

                    <i class="bi bi-check-lg me-1"></i>

                    <span id="saveButtonText">
                        Save Contact
                    </span>

                </button>

            </div>

        </div>

    </div>

</div>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- My JS -->

<script src="js/main.js"></script>

</body>

</html>
